---
- name: Configure application hosts (Docker + monitoring agent)
  hosts: app_servers
  become: true

  vars:
    docker_compose_version: "2.27.0"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base dependencies
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker repository
      apt_repository:
        repo: "deb https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: true

    - name: Ensure Docker service is running
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ansible_user to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Deploy node-exporter for Prometheus scraping
      docker_container:
        name: node-exporter
        image: prom/node-exporter:latest
        state: started
        restart_policy: always
        ports:
          - "9100:9100"

    - name: Pull latest application image
      docker_image:
        name: "ghcr.io/hasan-cloud395/cloud-native-cicd-pipeline:latest"
        source: pull

    - name: Run application container
      docker_container:
        name: myapp
        image: "ghcr.io/hasan-cloud395/cloud-native-cicd-pipeline:latest"
        state: started
        restart_policy: always
        ports:
          - "5000:5000"
        env:
          APP_VERSION: "1.0.0"
